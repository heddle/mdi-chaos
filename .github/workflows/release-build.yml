name: Publish release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.runnable.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify and package
        run: bash scripts/build-runnable.sh "$GITHUB_REF_NAME"
      - name: Upload runnable ZIP
        id: runnable
        uses: actions/upload-artifact@v7
        with:
          path: target/mdi-chaos-*-runnable.zip
          archive: false
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified runnable ZIP
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release-assets
          skip-decompress: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip="release-assets/mdi-chaos-${GITHUB_REF_NAME#v}-runnable.zip"
          unzip -tq "$zip"
          mv "$zip" release-assets/mdi-chaos-runnable.zip
          gh release create "$GITHUB_REF_NAME" "release-assets/mdi-chaos-runnable.zip#Runnable ZIP (Java 17+)" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "MDI Chaos Lab $GITHUB_REF_NAME" --generate-notes \
            --notes 'Extract the runnable ZIP and run `java -jar mdi-chaos.jar` with Java 17 or newer. Keep the bundled `lib` folder next to the JAR.'

name: Publish release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing version tag to rebuild, test, and publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release-tag || github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.runnable.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify and package
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          bash scripts/build-runnable.sh "$RELEASE_TAG"
      - name: Upload runnable ZIP
        id: runnable
        uses: actions/upload-artifact@v7
        with:
          path: target/mdi-chaos-*-runnable.zip
          archive: false
          if-no-files-found: error

  desktop-smoke-linux:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download runnable ZIP
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release-assets
          skip-decompress: true
      - name: Install virtual desktop and OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0 mesa-utils
      - name: Verify packaged app on a virtual desktop
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a --server-args="-screen 0 1600x1000x24 +extension GLX" bash -euc '
            glxinfo -B
            bash scripts/smoke-test-zip.sh "$1"
          ' bash "release-assets/mdi-chaos-${RELEASE_TAG#v}-runnable.zip"

  desktop-smoke-windows:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download runnable ZIP
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release-assets
          skip-decompress: true
      - name: Verify packaged app on Windows
        shell: bash
        run: |
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          bash scripts/smoke-test-zip.sh "release-assets/mdi-chaos-${RELEASE_TAG#v}-runnable.zip"

  desktop-smoke-macos:
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Match the Java 17 update that passed the Intel macOS desktop test.
          java-version: '17.0.12'
      - name: Download runnable ZIP
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release-assets
          skip-decompress: true
      - name: Verify packaged app on macOS
        shell: bash
        run: |
          zip="release-assets/mdi-chaos-${RELEASE_TAG#v}-runnable.zip"
          status=0
          bash scripts/smoke-test-zip.sh "$zip" || status=$?
          if [[ "$status" -ne 75 ]]; then
            exit "$status"
          fi
          echo "::warning::macOS desktop startup timed out. Retrying the full smoke test once."
          bash scripts/smoke-test-zip.sh "$zip"

  publish:
    needs: [build, desktop-smoke-linux, desktop-smoke-windows, desktop-smoke-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified runnable ZIP
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release-assets
          skip-decompress: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip="release-assets/mdi-chaos-${RELEASE_TAG#v}-runnable.zip"
          unzip -tq "$zip"
          mv "$zip" release-assets/mdi-chaos-runnable.zip
          gh release create "$RELEASE_TAG" "release-assets/mdi-chaos-runnable.zip#Runnable ZIP (Java 17+)" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "MDI Chaos Lab $RELEASE_TAG" --generate-notes \
            --notes 'Extract the runnable ZIP and run `java -jar mdi-chaos.jar` with Java 17 or newer. Keep the bundled `lib` folder next to the JAR.'

name: Verify latest ZIP on Windows

on:
  push:
    branches: [codex/windows-zip-verification]

permissions:
  contents: read

jobs:
  desktop-smoke:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download the latest public ZIP
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/heddle/mdi-chaos/releases/latest/download/mdi-chaos-runnable.zip' -OutFile mdi-chaos-runnable.zip
      - name: Run the packaged desktop checks
        shell: bash
        run: |
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          unzip -Z1 mdi-chaos-runnable.zip | sed -n '/\/mdi-chaos\.jar$/p'
          bash scripts/smoke-test-zip.sh mdi-chaos-runnable.zip
